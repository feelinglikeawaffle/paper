body{background:radial-gradient(ellipse at 50% 25%,#333a31 0,#20251f 50%,#111411 100%)}
#app{height:100dvh;display:flex;flex-direction:column;max-width:1600px;margin:auto;padding:10px;gap:9px}
.topbar{height:62px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 15px;background:linear-gradient(180deg,#333a32,#252b25);border:2px solid #596153;box-shadow:0 4px 0 #10130f, inset 0 1px #77806e; border-radius:5px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;background:#b4c58a;color:#20251d;display:grid;place-items:center;font-weight:1000;font-size:20px;box-shadow:3px 3px 0 #10130f;transform:rotate(-2deg)}h1{font-size:20px;letter-spacing:3px;margin:0;color:#e9e6d6}h1 span{color:var(--green)}.sub{font-size:9px;letter-spacing:2px;color:#aeb5a5;margin-top:3px}.stats{display:flex;gap:22px}.stat{min-width:90px}.stat small{display:block;font-size:9px;color:#9da594;letter-spacing:1px}.stat strong{font-size:18px;color:#f0e8d3;font-weight:800}.stat.money strong{color:var(--gold)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:9px;flex:1;min-height:0}
.office{position:relative;min-height:0;border:3px solid #4c5549;border-radius:5px;overflow:hidden;background:#8b7658;box-shadow:inset 0 0 0 3px #b49a70,0 5px 0 #10130f}
#game{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#game:active{cursor:grabbing}
.hudhint{position:absolute;left:13px;top:11px;padding:7px 9px;background:#171b17d9;border:1px solid #626d5b;color:#c7cdbb;font-size:10px;pointer-events:none}
.clutter{position:absolute;right:12px;top:11px;width:150px;background:#171b17d9;border:1px solid #626d5b;padding:7px 9px;font-size:9px;color:#b8c0ae;pointer-events:none}.bar{height:5px;background:#41483d;margin-top:5px}.bar i{display:block;height:100%;background:#b5bd80;width:0%}
.side{display:flex;flex-direction:column;gap:9px;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#69715e #20251f}
.card{background:linear-gradient(180deg,#30372f,#252b25);border:2px solid #50594c;box-shadow:0 4px 0 #10130f,inset 0 1px #687260;border-radius:4px;padding:12px}
.card h2{margin:0 0 10px;font-size:11px;letter-spacing:2px;color:#c3ceaa;text-transform:uppercase;display:flex;justify-content:space-between}
.printergrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
button{font:inherit;color:#e8e8d9;cursor:pointer;border:1px solid #626e58;background:linear-gradient(#46513f,#333d30);box-shadow:0 3px 0 #151a14;padding:9px 8px;border-radius:3px;transition:filter .12s,transform .12s;touch-action:manipulation}
button:hover{filter:brightness(1.18)}button:active{transform:translateY(2px);box-shadow:0 1px 0 #151a14}button:disabled{opacity:.38;cursor:not-allowed;filter:grayscale(.7)}
.printerbtn{font-size:10px;text-align:left;min-height:54px}.printerbtn b{display:block;font-size:11px;color:#e4d9bd;margin-bottom:5px}.printerbtn span{font-size:9px;color:#aab39d}
.upgrade{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;margin:6px 0;padding:10px;font-size:10px;gap:8px}.upgrade b{display:block;color:#e5e3d3;font-size:10px;margin-bottom:4px}.upgrade small{display:block;color:#aab39d;font-size:9px;line-height:1.4}.cost{color:var(--gold);white-space:nowrap;font-weight:bold}
.tabs{display:flex;gap:5px}.tabs button{flex:1;font-size:9px;padding:7px 3px}.tabs button.active{background:#899b68;color:#1c241a;border-color:#c1d39a}
.log{font-size:9px;line-height:1.6;color:#b9c0ae;max-height:95px;overflow:hidden}.log div{border-bottom:1px solid #424b40;padding:3px 0}.log em{font-style:normal;color:#d9bd83}
.footer{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;color:#7f8979;font-size:9px;padding:0 5px}
.toast{position:absolute;left:50%;top:48px;transform:translateX(-50%);padding:9px 14px;background:#1d251d;border:2px solid #a4b37c;color:#e6edce;font-size:11px;box-shadow:0 4px 0 #10130f;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.toast.show{opacity:1}
@media(max-width:760px){#app{padding:6px;gap:6px}.topbar{height:55px;padding:6px 9px}.logo{width:31px;height:31px;font-size:16px}h1{font-size:16px}.sub{font-size:7px}.stats{gap:10px}.stat{min-width:55px}.stat small{font-size:8px}.stat strong{font-size:14px}.main{grid-template-columns:1fr;grid-template-rows:minmax(230px,1fr) minmax(175px,35%);gap:6px}.side{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;overflow:auto;gap:6px}.card{padding:8px}.card h2{font-size:9px;margin-bottom:6px}.printerbtn{min-height:43px;padding:6px}.upgrade{margin:4px 0;padding:7px;font-size:9px}.upgrade small{font-size:8px}.logcard{grid-column:1/-1}.log{max-height:45px}.footer{height:22px;font-size:8px}.hudhint{font-size:8px;top:7px;left:7px}.clutter{top:7px;right:7px;width:115px;font-size:8px}}
@media(max-width:390px){.stats{gap:6px}.stat{min-width:48px}.stat strong{font-size:12px}.sub{letter-spacing:1px}}

<script>(()=>{

function drawPaper(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);const s=p.size,off=p.layer*2;ctx.shadowColor='#1b140c99';ctx.shadowBlur=7;ctx.shadowOffsetX=3;ctx.shadowOffsetY=5;ctx.fillStyle='#e9e0cc';ctx.fillRect(-s/2+off,-s*.66+off,s,s*1.32);ctx.shadowColor='transparent';ctx.strokeStyle='#8b806a';ctx.lineWidth=1;ctx.strokeRect(-s/2+off,-s*.66+off,s,s*1.32);ctx.fillStyle='#777261';ctx.fillRect(-s/2+5,-s*.35,s*.48,2);for(let j=0;j<4;j++)ctx.fillRect(-s/2+5,-s*.16+j*6,s*(.38+(j%2)*.27),1);ctx.fillStyle='#9c4b3d';ctx.fillRect(-s/2+5,s*.38,s-10,3);ctx.restore();if(p.health<p.max){ctx.fillStyle='#302c24';ctx.fillRect(p.x-s/2,p.y+s*.72,s,3);ctx.fillStyle='#c46d54';ctx.fillRect(p.x-s/2,p.y+s*.72,s*clamp(p.health/p.max,0,1),3)}}
function drawGrainOverlay(){ctx.globalAlpha=.2;ctx.fillStyle=ctx.createPattern(grain,'repeat');ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
function frame(ts){const dt=Math.min(.04,(ts-last)/1000||0);last=ts;clock+=dt;clickTimer=Math.max(0,clickTimer-dt);autoImpactTimer-=dt;if(autoImpactTimer<=0){impactAt(W*.5,H*.56);autoImpactTimer=Math.max(.7,2.8-coolLevel*.24)}printCooldown=Math.max(0,printCooldown-dt);feedFlash=Math.max(0,feedFlash-dt);if(autoUnlocked){printerTimer+=dt;if(printerTimer>=interval()){printerTimer-=interval();spawn(printerCount+prestigePrinter);feedFlash=.5}}ctx.clearRect(0,0,W,H);drawDesk();const count=printerCount+prestigePrinter;for(let i=0;i<count;i++)drawPrinter(W*(count===1?.5:.18+i*.64/(count-1)),i);for(const p of papers){if(p.falling){p.vy+=360*dt;p.y+=p.vy*dt;p.x+=(p.targetX-p.x)*Math.min(1,dt*2.8);p.angle+=p.spin*dt;if(p.y>=p.targetY){p.y=p.targetY;p.falling=false;p.vy=0;p.angle=rand(-.13,.13)}}}papers.forEach(drawPaper);rect(0,H-27,W,27,'#282d27');rect(0,H-30,W,3,'#59604d');for(const b of bits){b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=280*dt;ctx.globalAlpha=clamp(b.life*2,0,1);rect(b.x,b.y,b.size,b.size,'#e9e0cc')}ctx.globalAlpha=1;if(impact){impact.r+=(radius()-impact.r)*.38;impact.life-=dt;ctx.strokeStyle='#f1d79b';ctx.globalAlpha=clamp(impact.life/.22,0,1);ctx.lineWidth=2;ctx.beginPath();ctx.arc(impact.x,impact.y,impact.r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;if(impact.life<=0)impact=null}bits=bits.filter(b=>b.life>0);drawGrainOverlay();requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();impactAt(e.clientX-r.left,e.clientY-r.top)});
$('print').addEventListener('click',()=>{if(printCooldown>0)return;spawn(1);printCooldown=interval();feedFlash=.5;updateUI();toast('ONE SHEET FED')});$('auto').addEventListener('click',()=>{if(autoUnlocked)toast('AUTOMATIC FEED ONLINE')});['printer','click','radius','damage','cool'].forEach(id=>$(id).addEventListener('click',()=>buy(id)));
$('researchRadius').addEventListener('click',()=>researchBuy('radius',25));$('researchDamage').addEventListener('click',()=>researchBuy('damage',40));$('researchPrinter').addEventListener('click',()=>researchBuy('printer',30));$('prestige').addEventListener('click',prestige);$('prestigePrinter').addEventListener('click',()=>buyPrestige('printer'));$('prestigeAuto').addEventListener('click',()=>buyPrestige('auto'));
requestAnimationFrame(frame);updateUI();
